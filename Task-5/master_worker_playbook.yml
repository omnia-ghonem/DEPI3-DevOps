        ansible.builtin.copy:
          dest: /etc/docker/daemon.json
          content: |
            {
              "exec-opts": ["native.cgroupdriver=systemd"],
              "log-driver": "json-file",
              "log-opts": {
                "max-size": "100m"
              }
            }
        notify: Restart-docker

      - name: Disable swap
        ansible.builtin.command: swapoff -a

      - name: Comment out all swap entries in /etc/fstab(disables swap permanently for Kubernetes nodes.)
        ansible.builtin.replace:
          path: /etc/fstab
          regexp: '^(.*\sswap\s.*)$'
          replace: '#\1'
          backup: true

      - name: Add kernel modules for Containerd
        ansible.builtin.copy:
          dest: /etc/modules-load.d/containerd.conf
          content: |
            overlay
            br_netfilter

      - name: Load kernel modules
        ansible.builtin.shell: |
          modprobe overlay
          modprobe br_netfilter

      - name: Set bridged iptables sysctl parameters(Redirects that output into the file /etc/sysctl.d/k8s.conf)
        ansible.posix.sysctl:
          name: "{{ param.name }}"
          value: "{{ param.value }}"
          state: present
          sysctl_file: /etc/sysctl.d/k8s.conf
        loop:
          - {name: net.bridge.bridge-nf-call-ip6tables,   value: 1}
          - {name: net.bridge.bridge-nf-call-iptables,    value: 1}
        loop_control:
          loop_var: param


      - name: Enabling Bridge Firewall Rule
        shell: "echo '1' > /proc/sys/net/ipv4/ip_forward"


