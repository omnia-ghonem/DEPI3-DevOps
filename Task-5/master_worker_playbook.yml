        sysctl:
          sysctl_file: /etc/sysctl.d/99-sysctl.conf
          name: net.ipv4.ip_forward
          value: "1"
          state: present
          reload: yes



      # ---------------- Firewall (firewalld instead of ufw) ----------------
      - name: Ensure firewalld is installed
        yum:
          name: firewalld
          state: present

      - name: Start and enable firewalld
        ansible.builtin.systemd:
          name: firewalld
          state: started
          enabled: true

      - name: Open Kubernetes worker node ports
        firewalld:
          port: "{{ item }}"
          permanent: yes
          state: enabled
          immediate: yes
        with_items:
          - 22/tcp
          - 10250/tcp
          - 30000-32767/tcp   # NodePort services
          - 10250/tcp

      # ---------------- Kubernetes Repo ----------------
      - name: Add Kubernetes repo
        copy:
          dest: /etc/yum.repos.d/kubernetes.repo
          content: |
            [kubernetes]
            name=Kubernetes
            baseurl=https://pkgs.k8s.io/core:/stable:/v1.34/rpm/
            enabled=1
            gpgcheck=1
            gpgkey=https://pkgs.k8s.io/core:/stable:/v1.34/rpm/repodata/repomd.xml.key

      - name: Install kubeadm, kubelet, kubectl
        yum:
          name:
            - kubelet
            - kubeadm
            - kubectl
          state: present

      - name: Enable kubelet service
        ansible.builtin.systemd:
          name: kubelet
          enabled: true
          state: stopped  # kubeadm join will start it



      - name: Restart kubelet
        systemd:
          name: kubelet
          state: restarted
          enabled: yes

      - name: Apply sysctl params
        ansible.builtin.command: sysctl --system

      - name: Configure containerd default config
        ansible.builtin.shell: |
          mkdir -p /etc/containerd
          containerd config default | sudo tee /etc/containerd/config.toml



      - name: Enable and restart containerd
        ansible.builtin.systemd:
          name: containerd
          enabled: true
          state: restarted

          
      - name: Set SystemdCgroup = true in containerd config
        ansible.builtin.replace:
          path: /etc/containerd/config.toml
          regexp: '^(\s*)SystemdCgroup = false'
          replace: '\1SystemdCgroup = true'
          backup: yes


# workers already have Kubernetes configs and kubelet running from a previous join attempt,
# which causes kubeadm join to fail with errors like:
# kubelet.conf already exists
# ca.crt already exists
# Port 10250 is in use

# Start the worker node fresh so it can re-join without conflicts.
      - name: Reset worker node before joining (safe cleanup)
        command: kubeadm reset -f
        ignore_errors: true


# Remove stale state that blocks a new join.
      - name: Clean Kubernetes directories
        file:
          path: "{{ item }}"
          state: absent
        with_items:
          - /etc/cni/net.d
          - /var/lib/cni/
          - /var/lib/kubelet
          - /etc/kubernetes

# Ensure a clean networking state before kubeadm sets up new rules.
      - name: Flush iptables
        command: iptables -F
        ignore_errors: true

      - name: Reboot the system
        ansible.builtin.reboot:
          msg: "Reboot initiated by Ansible for Kubernetes worker setup"
          reboot_timeout: 150

      - name: Copy join script from control node
        copy:
          src: ./kubeadm_join_token.sh
          dest: /tmp/kubeadm_join_token.sh
          mode: '0755'

      - name: Join worker to cluster
        command: bash /tmp/kubeadm_join_token.sh


  handlers:
    - name: Restart-docker
      ansible.builtin.systemd_service:
        name: docker
        state: restarted